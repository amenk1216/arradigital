      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="notion-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#notion-bg)"/>
  <circle cx="300" cy="200" r="180" fill="#f59e0b" fill-opacity="0.12"/>
  <circle cx="950" cy="450" r="200" fill="#ec4899" fill-opacity="0.12"/>
  
  <text x="640" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
