<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="gas-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121e"/>
      <stop offset="50%" stop-color="#0a1c2a"/>
      <stop offset="100%" stop-color="#082b24"/>
    </linearGradient>
    <linearGradient id="gas-emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gas-card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2922" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1e19" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="gas-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#gas-bg-grad)"/>

  <!-- Circuit & Grid Lines -->
  <g stroke="#10b981" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="260" x2="1280" y2="260"/>
    <line x1="0" y1="460" x2="1280" y2="460"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="220" y1="0" x2="220" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="1060" y1="0" x2="1060" y2="720"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="320" cy="240" r="200" fill="#10b981" fill-opacity="0.14" filter="url(#gas-glow)"/>
  <circle cx="940" cy="420" r="220" fill="#06b6d4" fill-opacity="0.15" filter="url(#gas-glow)"/>

  <!-- Header Banner Text -->
  <text x="640" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
    JASA OTOMASI GOOGLE APPS SCRIPT &amp; WORKFLOW
  </text>
  <text x="640" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#a7f3d0" letter-spacing="0.5">
    Digitalisasi Google Sheets, Bot Notifikasi WhatsApp, Invoice PDF &amp; Web App Tanpa Server
  </text>

  <!-- Central Workflow Diagram Graphic -->
  <!-- Step 1: Input Sheets -->
  <g transform="translate(140, 180)">
    <rect x="0" y="0" width="260" height="340" rx="16" fill="#061c16" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="42" rx="16" fill="#0f3428"/>
    <text x="44" y="27" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">📊 Google Sheets Form</text>
    <circle cx="24" cy="21" r="6" fill="#10b981"/>

    <!-- Spreadsheet Mockup Lines -->
    <rect x="18" y="60" width="224" height="24" rx="4" fill="#0b241c"/>
    <text x="28" y="76" font-family="monospace" font-size="11" fill="#6ee7b7">ID | Customer | Nominal | Status</text>
    <rect x="18" y="94" width="224" height="22" rx="4" fill="#061a14"/>
    <text x="28" y="109" font-family="monospace" font-size="10" fill="#94a3b8">01 | Budi S    | 250.000 | Lunas</text>
    <rect x="18" y="124" width="224" height="22" rx="4" fill="#061a14"/>
    <text x="28" y="139" font-family="monospace" font-size="10" fill="#94a3b8">02 | Siti R    | 750.000 | Pending</text>
    <rect x="18" y="154" width="224" height="22" rx="4" fill="#061a14"/>
    <text x="28" y="169" font-family="monospace" font-size="10" fill="#94a3b8">03 | Hendra    | 500.000 | Proses</text>

    <!-- Trigger Event Indicator -->
    <rect x="18" y="200" width="224" height="110" rx="10" fill="#042017" stroke="#059669" stroke-dasharray="4"/>
    <text x="130" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">⚡ Otomatis Real-Time</text>
    <text x="130" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a7f3d0">Input Data ➜ Trigger Skrip</text>
    <text x="130" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6ee7b7">Tanpa Perlu Klik Manual</text>
  </g>

  <!-- Flow Connector 1 -->
  <g transform="translate(415, 330)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#34d399" stroke-width="3" stroke-dasharray="6"/>
    <polygon points="60,0 50,-6 50,6" fill="#34d399"/>
    <circle cx="30" cy="0" r="14" fill="#10b981" fill-opacity="0.2"/>
    <text x="30" y="5" text-anchor="middle" font-size="12" fill="#34d399">➔</text>
  </g>

  <!-- Step 2: Google Apps Script Core Engine -->
  <g transform="translate(490, 160)">
    <rect x="0" y="0" width="300" height="380" rx="18" fill="#08221c" stroke="#06b6d4" stroke-width="2.5" filter="url(#gas-glow)"/>
    <rect x="0" y="0" width="300" height="48" rx="18" fill="#0e3a30"/>
    <text x="150" y="31" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#67e8f9">⚙️ Google Apps Script Engine</text>

    <!-- Code Block Visual -->
    <rect x="20" y="65" width="260" height="170" rx="8" fill="#04130f" stroke="#0f4437"/>
    <text x="32" y="90" font-family="monospace" font-size="11" fill="#38bdf8">function onDataSubmitted(e) {</text>
    <text x="44" y="112" font-family="monospace" font-size="11" fill="#a7f3d0">  const pdf = generateInvoicePdf(e);</text>
    <text x="44" y="134" font-family="monospace" font-size="11" fill="#34d399">  sendWhatsAppNotification(e, pdf);</text>
    <text x="44" y="156" font-family="monospace" font-size="11" fill="#facc15">  syncAccountingDashboard(e);</text>
    <text x="32" y="178" font-family="monospace" font-size="11" fill="#38bdf8">}</text>
    <text x="32" y="210" font-family="monospace" font-size="10" fill="#64748b">// 100% Berjalan di Google Cloud (Gratis)</text>

    <!-- Benefits Inside Box -->
    <rect x="20" y="250" width="260" height="110" rx="10" fill="#092f25" stroke="#10b981" stroke-width="1.2"/>
    <text x="36" y="278" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">✓ Tanpa Biaya Server Bulanan</text>
    <text x="36" y="302" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">✓ Keamanan Akun Google Anda</text>
    <text x="36" y="326" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">✓ Akses API &amp; Webhook Lengkap</text>
  </g>

  <!-- Flow Connector 2 -->
  <g transform="translate(805, 330)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6"/>
    <polygon points="60,0 50,-6 50,6" fill="#06b6d4"/>
    <circle cx="30" cy="0" r="14" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="30" y="5" text-anchor="middle" font-size="12" fill="#06b6d4">➔</text>
  </g>

  <!-- Step 3: Multi Output (PDF & WhatsApp) -->
  <g transform="translate(880, 180)">
    <!-- Sub-card 1: PDF Invoice -->
    <rect x="0" y="0" width="260" height="155" rx="14" fill="#061c16" stroke="#ef4444" stroke-width="1.8"/>
    <rect x="0" y="0" width="260" height="38" rx="14" fill="#2d1515"/>
    <text x="36" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#fca5a5">📄 PDF Nota &amp; Invoice Otomatis</text>
    <circle cx="20" cy="19" r="6" fill="#ef4444"/>
    <rect x="16" y="52" width="180" height="10" rx="2" fill="#64748b"/>
    <rect x="16" y="70" width="228" height="60" rx="6" fill="#180e0e"/>
    <text x="30" y="92" font-family="monospace" font-size="11" fill="#f87171">INVOICE #INV-2026-0089</text>
    <text x="30" y="112" font-family="sans-serif" font-size="10" fill="#fecaca">Auto Simpan ke Google Drive</text>

    <!-- Sub-card 2: WhatsApp Notification -->
    <rect x="0" y="180" width="260" height="160" rx="14" fill="#061c16" stroke="#22c55e" stroke-width="1.8"/>
    <rect x="0" y="180" width="260" height="38" rx="14" fill="#14331e"/>
    <text x="36" y="204" font-family="sans-serif" font-size="13" font-weight="800" fill="#86efac">💬 WhatsApp Alert &amp; Bot</text>
    <circle cx="20" cy="199" r="6" fill="#22c55e"/>
    <rect x="16" y="230" width="228" height="92" rx="8" fill="#0d2417"/>
    <text x="28" y="252" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Notifikasi Instan ke HP:</text>
    <text x="28" y="272" font-family="sans-serif" font-size="10" fill="#a7f3d0">"Halo Kak Budi, pesanan Anda</text>
    <text x="28" y="290" font-family="sans-serif" font-size="10" fill="#a7f3d0">telah terkonfirmasi. Unduh nota:"</text>
    <text x="28" y="308" font-family="monospace" font-size="9" fill="#38bdf8">https://drive.google.com/...</text>
  </g>

  <!-- Bottom Feature Highlights Banner -->
  <g transform="translate(140, 585)">
    <!-- Badge 1: 0 Biaya Server -->
    <rect x="0" y="0" width="235" height="56" rx="10" fill="#0b241c" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" font-size="14" fill="#34d399">💰</text>
    <text x="56" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Rp 0 Biaya Cloud</text>
    <text x="56" y="44" font-family="sans-serif" font-size="11" fill="#a7f3d0">Hemat Jutaan Rupiah</text>

    <!-- Badge 2: Hemat Waktu -->
    <rect x="255" y="0" width="235" height="56" rx="10" fill="#0b241c" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="283" cy="28" r="14" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="283" y="33" text-anchor="middle" font-size="14" fill="#67e8f9">⏱️</text>
    <text x="311" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Hemat 20+ Jam/Minggu</text>
    <text x="311" y="44" font-family="sans-serif" font-size="11" fill="#a7f3d0">Bebas Tugas Manual</text>

    <!-- Badge 3: Google Drive & Sheets Sync -->
    <rect x="510" y="0" width="235" height="56" rx="10" fill="#0b241c" stroke="#eab308" stroke-width="1.5"/>
    <circle cx="538" cy="28" r="14" fill="#eab308" fill-opacity="0.2"/>
    <text x="538" y="33" text-anchor="middle" font-size="14" fill="#facc15">📁</text>
    <text x="566" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Kerapian Database</text>
    <text x="566" y="44" font-family="sans-serif" font-size="11" fill="#a7f3d0">Google Workspace Asli</text>

    <!-- Badge 4: Support & SOP -->
    <rect x="765" y="0" width="235" height="56" rx="10" fill="#0b241c" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="793" cy="28" r="14" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="793" y="33" text-anchor="middle" font-size="14" fill="#c084fc">🎓</text>
    <text x="821" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Video Panduan &amp; SOP</text>
    <text x="821" y="44" font-family="sans-serif" font-size="11" fill="#a7f3d0">Pendampingan Sampai Jalan</text>
  </g>
</svg>
