<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#14102c"/>
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad)"/>

  <!-- Circuit / Grid Lines -->
  <g stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="260" x2="1280" y2="260"/>
    <line x1="0" y1="460" x2="1280" y2="460"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="1080" y1="0" x2="1080" y2="720"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="280" cy="220" r="180" fill="#3b82f6" fill-opacity="0.15" filter="url(#neon-glow)"/>
  <circle cx="980" cy="460" r="220" fill="#8b5cf6" fill-opacity="0.16" filter="url(#neon-glow)"/>

  <!-- Header Banner Text -->
  <text x="640" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
    JASA PEMBUATAN WEBSITE KUSTOM
  </text>
  <text x="640" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Landing Page Konversi Tinggi &amp; Company Profile Profesional Modern
  </text>

  <!-- Central Laptop / Desktop Browser Mockup -->
  <g transform="translate(180, 160)">
    <!-- Glow Under Laptop -->
    <rect x="20" y="20" width="620" height="380" rx="20" fill="#3b82f6" fill-opacity="0.2" filter="url(#neon-glow)"/>
    <!-- Laptop Window Frame -->
    <rect x="0" y="0" width="640" height="390" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <!-- Browser Top Bar -->
    <rect x="0" y="0" width="640" height="42" rx="14" fill="#1e293b"/>
    <!-- Browser Window Dots -->
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#eab308"/>
    <circle cx="64" cy="21" r="6" fill="#22c55e"/>
    <!-- Address Bar -->
    <rect x="100" y="10" width="420" height="22" rx="6" fill="#0f172a"/>
    <text x="120" y="25" font-family="monospace" font-size="11" fill="#60a5fa">https://bisnis-anda.my.id</text>

    <!-- Inside Browser Content Mockup -->
    <rect x="24" y="60" width="260" height="24" rx="4" fill="url(#primary-glow)"/>
    <rect x="24" y="96" width="340" height="12" rx="3" fill="#64748b"/>
    <rect x="24" y="116" width="280" height="10" rx="3" fill="#475569"/>

    <rect x="24" y="146" width="130" height="34" rx="6" fill="#2563eb"/>
    <text x="89" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Hubungi WhatsApp</text>

    <!-- Graphic showcase inside window -->
    <rect x="410" y="64" width="200" height="160" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="510" cy="120" r="32" fill="#3b82f6" fill-opacity="0.3"/>
    <path d="M495 120 L525 120 M510 105 L510 135" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <rect x="430" y="168" width="160" height="8" rx="2" fill="#64748b"/>
    <rect x="450" y="184" width="120" height="8" rx="2" fill="#475569"/>

    <!-- Bottom Feature Cards Inside Window -->
    <rect x="24" y="240" width="180" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="40" y="256" width="40" height="10" rx="2" fill="#38bdf8"/>
    <rect x="40" y="276" width="140" height="6" rx="2" fill="#64748b"/>
    <rect x="40" y="290" width="120" height="6" rx="2" fill="#475569"/>
    <rect x="40" y="320" width="80" height="20" rx="4" fill="#0284c7"/>

    <rect x="228" y="240" width="180" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="244" y="256" width="40" height="10" rx="2" fill="#a855f7"/>
    <rect x="244" y="276" width="140" height="6" rx="2" fill="#64748b"/>
    <rect x="244" y="290" width="120" height="6" rx="2" fill="#475569"/>
    <rect x="244" y="320" width="80" height="20" rx="4" fill="#7c3aed"/>

    <rect x="432" y="240" width="180" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="448" y="256" width="40" height="10" rx="2" fill="#34d399"/>
    <rect x="448" y="276" width="140" height="6" rx="2" fill="#64748b"/>
    <rect x="448" y="290" width="120" height="6" rx="2" fill="#475569"/>
    <rect x="448" y="320" width="80" height="20" rx="4" fill="#059669"/>
  </g>

  <!-- Mobile Phone Responsive Mockup -->
  <g transform="translate(860, 200)">
    <rect x="10" y="10" width="220" height="410" rx="26" fill="#8b5cf6" fill-opacity="0.25" filter="url(#neon-glow)"/>
    <rect x="0" y="0" width="220" height="420" rx="26" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect x="70" y="10" width="80" height="14" rx="7" fill="#1e293b"/>
    <circle cx="130" cy="17" r="3.5" fill="#3b82f6"/>
    <!-- Phone Screen -->
    <rect x="14" y="36" width="192" height="364" rx="14" fill="#090d16"/>
    <rect x="26" y="56" width="120" height="14" rx="3" fill="#60a5fa"/>
    <rect x="26" y="80" width="168" height="8" rx="2" fill="#64748b"/>
    <rect x="26" y="94" width="140" height="8" rx="2" fill="#475569"/>
    <rect x="26" y="118" width="168" height="90" rx="8" fill="#1e293b"/>
    <circle cx="110" cy="163" r="18" fill="#8b5cf6" fill-opacity="0.4"/>
    <rect x="26" y="224" width="168" height="34" rx="6" fill="#22c55e"/>
    <text x="110" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Order via WhatsApp</text>
    <rect x="26" y="274" width="168" height="50" rx="6" fill="#1e293b"/>
    <rect x="36" y="288" width="80" height="6" rx="2" fill="#94a3b8"/>
    <rect x="36" y="302" width="120" height="6" rx="2" fill="#475569"/>
    <rect x="26" y="336" width="168" height="50" rx="6" fill="#1e293b"/>
  </g>

  <!-- Feature Badge Overlay Highlights -->
  <g transform="translate(180, 585)">
    <!-- Badge 1: 100% Mobile Ready -->
    <rect x="0" y="0" width="210" height="56" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="28" y="33" text-anchor="middle" font-size="14" fill="#60a5fa">📱</text>
    <text x="56" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Mobile-First</text>
    <text x="56" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">Optimal di HP &amp; PC</text>

    <!-- Badge 2: Super Speed 100 -->
    <rect x="230" y="0" width="210" height="56" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="258" cy="28" r="14" fill="#22c55e" fill-opacity="0.2"/>
    <text x="258" y="33" text-anchor="middle" font-size="14" fill="#4ade80">⚡</text>
    <text x="286" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Ultra Cepat</text>
    <text x="286" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">Skor PageSpeed 95+</text>

    <!-- Badge 3: SEO & Analytics -->
    <rect x="460" y="0" width="210" height="56" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <circle cx="488" cy="28" r="14" fill="#eab308" fill-opacity="0.2"/>
    <text x="488" y="33" text-anchor="middle" font-size="14" fill="#facc15">🔍</text>
    <text x="516" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">SEO Terintegrasi</text>
    <text x="516" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">Mudah Terindeks Google</text>

    <!-- Badge 4: Garansi & Support -->
    <rect x="690" y="0" width="210" height="56" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="718" cy="28" r="14" fill="#a855f7" fill-opacity="0.2"/>
    <text x="718" y="33" text-anchor="middle" font-size="14" fill="#c084fc">🛡️</text>
    <text x="746" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Garansi Revisi</text>
    <text x="746" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">Pendampingan Penuh</text>
  </g>
</svg>
